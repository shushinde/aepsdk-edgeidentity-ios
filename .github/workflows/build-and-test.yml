name: Build and Test

on:
  pull_request:

jobs:
  validate-code:
    name: Validate Code
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Resolve Swift packages
        run: make setup

      - name: Lint Source Code
        run: make lint

  test-spm:
    name: Test SPM
    runs-on: macos-26
    needs: validate-code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Test SPM integration
        run: make test-SPM-integration
